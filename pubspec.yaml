name: previsao_tempo
description: "Aplicativo Flutter de previsão do tempo para cidades brasileiras com dados do CPTEC/INPE."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Requisições HTTP ao serviço do CPTEC/INPE
  http: ^1.2.2
  # Interpretação (parse) das respostas em XML
  xml: ">=6.5.0 <8.0.0"
  # Persistência local (cidades recentes, favoritas e cache da previsão)
  shared_preferences: ^2.3.0
  # Gráfico de temperaturas
  fl_chart: ^1.0.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=5.0.0 <7.0.0"

flutter:
  uses-material-design: true
